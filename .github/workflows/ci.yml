name: ci

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24, 26]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run the tests
        run: npm test
      - name: Run the public scrub scan
        run: node scripts/scrub-scan.mjs
      - name: Job summary
        if: always()
        shell: bash
        run: |
          echo "Skipped steps: 0. Steps that need a login arrive in a later build step and will show SKIPPED with a reason." >> "$GITHUB_STEP_SUMMARY"
